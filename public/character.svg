<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a180b"/>
      <stop offset="50%" stop-color="#152e18"/>
      <stop offset="100%" stop-color="#050c06"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0ff48"/>
      <stop offset="100%" stop-color="#70a72c"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#a8ff2a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGrad)"/>
  <rect x="5" y="5" width="190" height="190" fill="none" stroke="#4c7122" stroke-width="2"/>
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#a8ff2a" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Cyber Grid Lines -->
  <path d="M 0 150 L 200 150 M 0 170 L 200 170 M 0 185 L 200 185" stroke="#1d381c" stroke-width="1"/>
  <path d="M 40 150 L 10 200 M 70 150 L 50 200 M 100 150 L 100 200 M 130 150 L 150 200 M 160 150 L 190 200" stroke="#1d381c" stroke-width="1"/>

  <!-- Pixel Hair Back -->
  <path d="M 50 70 h 100 v 70 h -100 z" fill="#365e19"/>
  <path d="M 40 80 h 120 v 50 h -120 z" fill="#477823"/>

  <!-- Body / Jacket / Collar -->
  <path d="M 60 140 h 80 v 60 h -80 z" fill="#0d1b0e"/>
  <path d="M 50 150 h 100 v 50 h -100 z" fill="#142615" stroke="#4c7122" stroke-width="2"/>
  <!-- Cyber Jacket Trim -->
  <path d="M 85 150 v 50 M 115 150 v 50" stroke="#a8ff2a" stroke-width="3"/>
  <path d="M 65 160 h 20 v 30 h -20 z M 115 160 h 20 v 30 h -20 z" fill="#09120a" stroke="#70a72c" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="86" y="125" width="28" height="25" fill="#ffd1b3"/>
  <rect x="86" y="135" width="28" height="15" fill="#0d1b0e" opacity="0.2"/>

  <!-- Face Skin -->
  <rect x="66" y="65" width="68" height="65" rx="4" fill="#ffe0cc"/>
  <rect x="62" y="75" width="76" height="45" fill="#ffe0cc"/>
  <!-- Cheeks pixel blush -->
  <rect x="70" y="98" width="12" height="6" fill="#ffb3ba" opacity="0.6"/>
  <rect x="118" y="98" width="12" height="6" fill="#ffb3ba" opacity="0.6"/>

  <!-- Eyes / Anime Pixel Style -->
  <rect x="74" y="86" width="14" height="12" fill="#0d1b0e"/>
  <rect x="112" y="86" width="14" height="12" fill="#0d1b0e"/>
  <rect x="76" y="88" width="10" height="8" fill="#a8ff2a"/>
  <rect x="114" y="88" width="10" height="8" fill="#a8ff2a"/>
  <rect x="80" y="88" width="4" height="4" fill="#ffffff"/>
  <rect x="118" y="88" width="4" height="4" fill="#ffffff"/>
  <!-- Eyebrows -->
  <rect x="72" y="80" width="18" height="3" fill="#477823"/>
  <rect x="110" y="80" width="18" height="3" fill="#477823"/>

  <!-- Cute Smile -->
  <path d="M 92 110 h 16 v 4 h -16 z" fill="#d9777f"/>
  <path d="M 94 112 h 12 v 2 h -12 z" fill="#ffffff"/>

  <!-- Cyber VR Visor / Headset -->
  <rect x="58" y="62" width="84" height="18" rx="3" fill="#0d1b0e" stroke="#a8ff2a" stroke-width="2"/>
  <rect x="62" y="66" width="76" height="10" fill="url(#visorGrad)"/>
  <rect x="66" y="68" width="20" height="3" fill="#ffffff" opacity="0.8"/>

  <!-- Headset Mic -->
  <path d="M 58 70 h -8 v 35 h 20" fill="none" stroke="#a8ff2a" stroke-width="2"/>
  <circle cx="70" cy="105" r="4" fill="#c0ff48"/>

  <!-- Pixel Hair Front / Spiky Anime Bangs -->
  <path d="M 55 50 L 70 70 L 60 40 L 85 65 L 75 30 L 100 60 L 110 30 L 120 65 L 140 40 L 130 70 L 145 50 L 138 85 L 148 110 L 138 115 L 135 85 L 65 85 L 62 115 L 52 110 L 62 85 Z" fill="url(#hairGrad)"/>
  <!-- Hair Highlights -->
  <path d="M 75 35 L 85 55 M 100 35 L 108 55 M 125 45 L 130 65" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- Floating Arcade Particles -->
  <rect x="25" y="45" width="4" height="4" fill="#a8ff2a"/>
  <rect x="170" y="55" width="5" height="5" fill="#00ffff"/>
  <rect x="30" y="125" width="4" height="4" fill="#c0ff48"/>
  <rect x="165" y="135" width="6" height="6" fill="#a8ff2a"/>

  <!-- Status Tag -->
  <rect x="50" y="178" width="100" height="16" fill="#081006" stroke="#a8ff2a" stroke-width="1"/>
  <text x="100" y="190" font-family="'Courier New', monospace" font-size="9" font-weight="bold" fill="#a8ff2a" text-anchor="middle" letter-spacing="1">P1: DEV_HERO</text>
</svg>
